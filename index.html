<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>考场时钟</title>
<meta name="description" content="广东省考行测 / 申论考场时钟模拟，支持暂停" />
<meta name="theme-color" content="#16253b" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="考场时钟" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #16253b 0%, #1e3a5f 55%, #2a4d7e 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  .page { min-height: 100vh; padding: 24px 16px calc(40px + env(safe-area-inset-bottom)); padding-top: calc(24px + constant(safe-area-inset-top)); padding-top: calc(24px + env(safe-area-inset-top, 0px)); display: flex; justify-content: center; }
  .inner { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }

  .tabs { margin-top: 18px; display: flex; background: rgba(255,255,255,.1); border-radius: 999px; padding: 4px; }
  .tab { min-width: 88px; text-align: center; padding: 8px 18px; border-radius: 999px; color: rgba(255,255,255,.72); font-size: 15px; cursor: pointer; user-select: none; transition: all .2s; }
  .tab.active { background: #fff; color: #1e3a5f; font-weight: 700; }

  .clock-card { margin-top: 16px; width: 100%; background: #fff; border-radius: 14px; padding: 20px 14px 18px; box-shadow: 0 9px 25px rgba(0,0,0,.28); transition: box-shadow .3s; }
  .clock-card.finished { box-shadow: 0 0 0 3px rgba(239,68,68,.45), 0 9px 25px rgba(0,0,0,.28); }

  .clock-face { position: relative; width: 290px; height: 290px; margin: 0 auto; border-radius: 50%; background: #fff; border: 1px solid #e4e8f0; box-shadow: inset 0 0 20px rgba(30,58,95,.08), 0 5px 15px rgba(30,58,95,.12); }
  .tick { position: absolute; top: 0; left: 50%; width: 1.5px; height: 8px; margin-left: -0.75px; background: #c3cad6; transform-origin: 50% 145px; border-radius: 1px; }
  .tick.major { width: 3px; height: 15px; margin-left: -1.5px; background: #33415c; }
  .num { position: absolute; width: 32px; height: 32px; line-height: 32px; text-align: center; font-size: 20px; font-weight: 700; color: #1e3a5f; }

  .hand { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; border-radius: 4px; transition: transform .12s linear; }
  .hand.hour { width: 8px; height: 65px; margin-left: -4px; background: #1e3a5f; }
  .hand.minute { width: 5px; height: 110px; margin-left: -2.5px; background: #33415c; }
  .hand.second { width: 2px; height: 134px; margin-left: -1px; background: #e5484d; }
  .hand.paused { opacity: .55; }
  .hand.no-trans { transition: none; }
  .cap { position: absolute; left: 50%; top: 50%; width: 17px; height: 17px; margin: -8.5px 0 0 -8.5px; border-radius: 50%; background: #e5484d; border: 3px solid #fff; z-index: 5; }

  .clock-info { margin-top: 15px; text-align: center; }
  .exam-name { font-size: 18px; font-weight: 700; color: #1e3a5f; }

  .digital { margin-top: 18px; display: flex; }
  .digital-block { flex: 1; text-align: center; }
  .digital-label { font-size: 12px; color: #8a94a6; }
  .digital-value { margin-top: 4px; font-size: 30px; font-weight: 700; font-family: "SF Mono", Menlo, Consolas, monospace; color: #1e3a5f; letter-spacing: 1px; }
  .remain-normal { color: #2563eb; }
  .remain-warn { color: #f59e0b; }
  .remain-danger { color: #ef4444; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  .progress-track { margin-top: 16px; }
  .seek { position: relative; width: 100%; height: 26px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .seek-track { position: absolute; left: 0; right: 0; top: 50%; height: 7px; margin-top: -3.5px; border-radius: 999px; background: #edf0f6; }
  .seek-fill { position: absolute; left: 0; top: 50%; height: 7px; margin-top: -3.5px; border-radius: 999px; background: #2563eb; }
  .seek-thumb { position: absolute; top: 50%; width: 20px; height: 20px; margin-top: -10px; margin-left: -10px; border-radius: 50%; background: #fff; border: 5px solid #2563eb; box-shadow: 0 1px 5px rgba(0,0,0,.35); }
  .seek-fill, .seek-thumb { transition: none; }
  .progress-text { margin-top: 7px; text-align: center; font-size: 12px; color: #98a2b3; }

  .controls { margin-top: 16px; width: 100%; display: flex; gap: 12px; }
  .btn { flex: 0 0 110px; height: 48px; line-height: 48px; text-align: center; border-radius: 999px; font-size: 16px; font-weight: 600; cursor: pointer; user-select: none; }
  .btn-reset { background: rgba(255,255,255,.92); color: #1e3a5f; }
  .btn-main { flex: 1; background: #2563eb; color: #fff; }
  .btn-main.pause { background: #f59e0b; }
  .btn-main.disabled { background: #9aa7b8; cursor: not-allowed; }

  .mask { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(10,20,36,.75); display: flex; align-items: center; justify-content: center; z-index: 99; }
  .mask.hidden { display: none; }
  .mask-card { width: 280px; background: #fff; border-radius: 14px; padding: 28px 22px 22px; text-align: center; }
  .mask-title { font-size: 20px; font-weight: 700; color: #1e3a5f; }
  .mask-desc { margin-top: 8px; font-size: 14px; color: #667085; }
  .mask-btns { margin-top: 20px; display: flex; gap: 10px; }
  .mask-btn { flex: 1; height: 42px; line-height: 42px; font-size: 15px; border-radius: 999px; cursor: pointer; }
  .mask-btn-ghost { background: #eef2f8; color: #1e3a5f; }
  .mask-btn-primary { background: #2563eb; color: #fff; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 80px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(10, 20, 36, .85);
    color: #fff;
    font-size: 14px;
    padding: 10px 22px;
    border-radius: 999px;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 通用确认框（替代浏览器 confirm，任何环境下都可靠可见） */
  .confirm-mask { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(10, 20, 36, .75); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .confirm-mask.hidden { display: none; }
  .confirm-card { width: 280px; background: #fff; border-radius: 14px; padding: 26px 22px 20px; text-align: center; }
  .confirm-title { font-size: 18px; font-weight: 700; color: #1e3a5f; }
  .confirm-desc { margin-top: 8px; font-size: 14px; color: #667085; line-height: 1.6; }
  .confirm-btns { margin-top: 18px; display: flex; gap: 10px; }
  .confirm-btn { flex: 1; height: 40px; line-height: 40px; font-size: 14px; border-radius: 999px; cursor: pointer; }
  .confirm-btn-cancel { background: #eef2f8; color: #1e3a5f; }
  .confirm-btn-ok { background: #2563eb; color: #fff; }
</style>
</head>
<body>
<div class="page">
  <div class="inner">
    <div class="tabs">
      <div class="tab" id="tab-xingce">行测</div>
      <div class="tab" id="tab-shenlun">申论</div>
    </div>

    <div class="clock-card" id="card">
      <div class="clock-face" id="face"></div>
      <div class="clock-info">
        <div class="exam-name" id="examName"></div>
      </div>
      <div class="digital">
        <div class="digital-block">
          <div class="digital-label">模拟时刻</div>
          <div class="digital-value" id="clockText"></div>
        </div>
        <div class="digital-block">
          <div class="digital-label">剩余时间</div>
          <div class="digital-value" id="remainText"></div>
        </div>
      </div>
      <div class="progress-track">
        <div class="seek" id="seek">
          <div class="seek-track"></div>
          <div class="seek-fill" id="seekFill"></div>
          <div class="seek-thumb" id="seekThumb"></div>
        </div>
      </div>
      <div class="progress-text" id="progressText"></div>
    </div>

    <div class="controls">
      <div class="btn btn-reset" id="btnReset">重置</div>
      <div class="btn btn-main" id="btnMain">开始</div>
    </div>
  </div>
</div>

<div class="mask hidden" id="mask">
  <div class="mask-card">
    <div class="mask-title">考试时间到</div>
    <div class="mask-desc">请停止作答</div>
    <div class="mask-btns">
      <div class="mask-btn mask-btn-ghost" id="btnMaskClose">知道了</div>
      <div class="mask-btn mask-btn-primary" id="btnMaskRestart">重新开始</div>
    </div>
  </div>
</div>

<!-- 通用确认框（替代浏览器 confirm，任何环境下都可靠可见） -->
<div class="confirm-mask hidden" id="confirmBox">
  <div class="confirm-card">
    <div class="confirm-title" id="confirmTitle"></div>
    <div class="confirm-desc" id="confirmDesc"></div>
    <div class="confirm-btns">
      <div class="confirm-btn confirm-btn-cancel" id="confirmCancel">取消</div>
      <div class="confirm-btn confirm-btn-ok" id="confirmOk">确定</div>
    </div>
  </div>
</div>

<script>
  var EXAMS = {
    xingce: { key: 'xingce', name: '行政职业能力测验', startHour: 14, startMin: 0, durationMs: 90 * 60 * 1000 },
    shenlun: { key: 'shenlun', name: '申论', startHour: 16, startMin: 15, durationMs: 150 * 60 * 1000 }
  };
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(t) { return pad2(Math.floor(t / 3600)) + ':' + pad2(Math.floor(t % 3600 / 60)) + ':' + pad2(t % 60); }

  var face = document.getElementById('face');
  for (var i = 0; i < 60; i++) {
    var t = document.createElement('div');
    t.className = 'tick' + (i % 5 === 0 ? ' major' : '');
    t.style.transform = 'rotate(' + (i * 6) + 'deg)';
    face.appendChild(t);
  }
  for (var nn = 1; nn <= 12; nn++) {
    var ang = (nn * 30 - 90) * Math.PI / 180;
    var n = document.createElement('div');
    n.className = 'num';
    n.textContent = nn;
    n.style.left = (145 + Math.cos(ang) * 108 - 16) + 'px';
    n.style.top = (145 + Math.sin(ang) * 108 - 16) + 'px';
    face.appendChild(n);
  }
  var hourHand = document.createElement('div'); hourHand.className = 'hand hour'; face.appendChild(hourHand);
  var minHand = document.createElement('div'); minHand.className = 'hand minute'; face.appendChild(minHand);
  var secHand = document.createElement('div'); secHand.className = 'hand second'; face.appendChild(secHand);
  var cap = document.createElement('div'); cap.className = 'cap'; face.appendChild(cap);

  var exam = EXAMS.xingce;
  var running = false, started = false, finished = false;
  var elapsed = 0, segStart = Date.now(), timer = null;
  var seekRect = null, isDragging = false, dragMode = 'coarse', jumping = false;
  var dragStartX = 0, dragStartVal = 0, dragAnchorX = 0, dragAnchorVal = 0;
  var lastX = 0, lastT = 0, slowMs = 0, dragThumbPct = 0;

  // —— 拖动进度条：快拖全程 1:1 粘手指；慢拖齿轮 1px≈1秒；松手零回弹；拖到尽头即结束 ——
  function seekPosFromEvent(e) {
    var t = e.touches && e.touches.length ? e.touches[0] : e;
    return t.clientX;
  }
  function applyDragPos(x, isDown) {
    var w = seekRect.width || 1;
    var maxSec = exam.durationMs / 1000;
    var coarseRatio = maxSec / w;
    var now = Date.now();
    var dt = now - lastT || 1;
    var dx = x - lastX;
    var speed = Math.abs(dx) / dt;
    var v;
    if (dragMode === 'coarse') {
      if (isDown) {
        v = dragStartVal;   // 按下时已按点击位置定位
      } else {
        if (speed < 0.04 && Math.abs(dx) > 0) { slowMs += dt; } else { slowMs = 0; }
        if (slowMs > 150 && x > seekRect.left + 1 && x < seekRect.left + w - 1) {
          // 持续慢拖 → 齿轮精细模式：1px ≈ 1 秒
          dragMode = 'fine';
          dragAnchorX = x;
          dragAnchorVal = dragStartVal + (x - dragStartX) * coarseRatio;
        }
        v = dragStartVal + (x - dragStartX) * coarseRatio;
      }
    }
    if (dragMode === 'fine') {
      if (speed > 0.15 || x <= seekRect.left + 1 || x >= seekRect.left + w - 1) {
        // 明显加速或到达轨道尽头 → 退出齿轮模式，值立即对齐手指（拖到尽头即结束，松手零回弹）
        dragMode = 'coarse';
        dragStartX = x;
        dragStartVal = Math.max(0, Math.min(w, x - seekRect.left)) * coarseRatio;
        v = dragStartVal;
      } else {
        v = dragAnchorVal + (x - dragAnchorX) * 1; // 齿轮：1px ≈ 1 秒
      }
    }
    lastX = x;
    lastT = now;
    var sec = Math.max(0, Math.min(maxSec, Math.round(v)));
    elapsed = sec * 1000;
    // 拇指位置：粗调 1:1 粘手指；齿轮模式下跟随时间值（与填充条粘在一起，松手零回弹）
    dragThumbPct = (dragMode === 'fine')
      ? Math.min(100, (sec / maxSec) * 100)
      : Math.max(0, Math.min(100, (x - seekRect.left) / w * 100));
    render();
  }
  function onSeekDown(e) {
    if (e.cancelable) e.preventDefault();
    seekRect = seekEl.getBoundingClientRect();
    isDragging = true;
    dragMode = 'coarse';
    slowMs = 0;
    jumping = true;   // 拖动期间指针瞬时跟随，不做过渡动画
    var x = seekPosFromEvent(e);
    if (running) { elapsed += Date.now() - segStart; running = false; stopTimer(); keepScreen(false); }
    finished = false;
    $('mask').classList.add('hidden');
    started = true;
    var pct0 = Math.max(0, Math.min(1, (x - seekRect.left) / (seekRect.width || 1)));
    dragStartVal = Math.round(pct0 * (exam.durationMs / 1000));
    dragStartX = x;
    lastX = x;
    lastT = Date.now();
    applyDragPos(x, true);
  }
  function onSeekMove(e) {
    if (!isDragging) return;
    if (e.cancelable) e.preventDefault();
    applyDragPos(seekPosFromEvent(e), false);
  }
  function onSeekUp() {
    if (!isDragging) return;
    isDragging = false;
    jumping = false;
    secHand.classList.remove('no-trans');
    minHand.classList.remove('no-trans');
    hourHand.classList.remove('no-trans');
    render();
  }

  // —— 屏幕常亮：PWA 用 Wake Lock，Electron 桌面版走 IPC ——
  var wakeLock = null;
  function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {});
  }
  function releaseWakeLock() {
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  function keepScreen(on) {
    if (window.electronIPC) { try { window.electronIPC.send('keep-screen-on', on); } catch (e) {} return; }
    if (on) requestWakeLock(); else releaseWakeLock();
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && running) keepScreen(true);
  });

  // —— 结束提示音（Web Audio，iOS / Android / 桌面通用）——
  var audioCtx = null;
  function ensureAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep() {
    ensureAudio();
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime;
    [0, 0.35, 0.7].forEach(function (off, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = i === 2 ? 880 : 660;
      gain.gain.setValueAtTime(0.0001, t0 + off);
      gain.gain.exponentialRampToValueAtTime(0.5, t0 + off + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0 + off);
      osc.stop(t0 + off + 0.32);
    });
  }

  // —— 轻提示（用于"无需重置"等场景的即时反馈）——
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1600);
  }

  // —— iPhone 灵动岛安全区兜底：独立安装模式下系统未报告顶部安全高度时手动补足 ——
  (function () {
    var isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    var isIOS = /iP(hone|od|ad)/.test(navigator.userAgent);
    if (!isIOS || !isStandalone) return;
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;height:env(safe-area-inset-top,0px);height:constant(safe-area-inset-top);';
    document.body.appendChild(probe);
    var inset = probe.offsetHeight || 0;
    document.body.removeChild(probe);
    if (inset < 20) inset = 62; // 灵动岛机型顶部安全区约 62px，系统未报告时手动兜底
    var style = document.createElement('style');
    style.id = 'ios-safe-top';
    style.textContent = '.page { padding-top: ' + (24 + inset) + 'px !important; }';
    document.head.appendChild(style);
  })();

  // —— 自定义确认框（替代浏览器 confirm，任何环境下都可靠可见）——
  var confirmOkHandler = null;
  function askConfirm(title, desc, onOk) {
    $('confirmTitle').textContent = title;
    $('confirmDesc').textContent = desc;
    confirmOkHandler = onOk;
    $('confirmBox').classList.remove('hidden');
  }
  function closeConfirm() {
    $('confirmBox').classList.add('hidden');
    confirmOkHandler = null;
  }
  $('confirmOk').addEventListener('click', function () {
    var fn = confirmOkHandler;
    closeConfirm();
    if (fn) fn();
  });
  $('confirmCancel').addEventListener('click', closeConfirm);

  function $(id) { return document.getElementById(id); }
  function render() {
    var ms = running ? elapsed + (Date.now() - segStart) : elapsed;
    if (ms >= exam.durationMs) {
      if (running && !finished) finish();   // 仅计时运行中自然到点才提醒；拖动定位到尽头只显示、不提醒
      ms = exam.durationMs;
    }
    var totalSec = Math.floor(ms / 1000);
    var clockSec = (exam.startHour * 3600 + exam.startMin * 60 + totalSec) % 86400;
    var simSec = exam.startHour * 3600 + exam.startMin * 60 + ms / 1000;
    var remainMs = Math.max(0, exam.durationMs - ms);
    // 与模拟时刻共用同一个整数秒基准，两者严格同步（消除 ±1 秒时差）
    var remainSec = Math.max(0, exam.durationMs / 1000 - totalSec);
    var level = remainMs <= 5 * 60 * 1000 ? 'danger' : (remainMs <= 15 * 60 * 1000 ? 'warn' : 'normal');

    $('clockText').textContent = fmt(clockSec);
    $('remainText').textContent = fmt(remainSec);
    $('remainText').className = 'digital-value remain-' + level;
    var pct = Math.min(100, ms / exam.durationMs * 100);
    var fillColor = level === 'danger' ? '#ef4444' : (level === 'warn' ? '#f59e0b' : '#2563eb');
    // 拖动中填充条与拇指一起 1:1 跟随手指/鼠标（不分离）；松手后一起回落到真实进度
    var showPct = isDragging ? dragThumbPct : pct;
    $('seekFill').style.width = showPct + '%';
    $('seekFill').style.background = fillColor;
    $('seekThumb').style.left = showPct + '%';
    $('progressText').textContent = finished ? '已结束' : (running ? '进行中' : (started ? '已暂停' : '未开始'));
    if (jumping) {
      secHand.classList.add('no-trans');
      minHand.classList.add('no-trans');
      hourHand.classList.add('no-trans');
    }
    // 累计角度不取余：跨越 360° 时指针顺时针自然衔接，不再逆时针回旋
    hourHand.style.transform = 'rotate(' + (simSec / 120) + 'deg)';
    minHand.style.transform = 'rotate(' + (simSec / 10) + 'deg)';
    secHand.style.transform = 'rotate(' + (simSec * 6) + 'deg)';
    secHand.classList.toggle('paused', !running);
    $('card').classList.toggle('finished', finished);
    $('examName').textContent = exam.name;
    $('btnMain').textContent = finished ? '已结束' : (running ? '暂停' : (started ? '继续' : '开始'));
    $('btnMain').classList.toggle('pause', running);
    $('btnMain').classList.toggle('disabled', finished);
    $('tab-xingce').classList.toggle('active', exam.key === 'xingce');
    $('tab-shenlun').classList.toggle('active', exam.key === 'shenlun');
  }
  function finish() {
    elapsed = exam.durationMs;
    running = false;
    finished = true;
    stopTimer();
    keepScreen(false);
    $('mask').classList.remove('hidden');
    if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
    beep();
  }
  function startTimer() { stopTimer(); timer = setInterval(render, 100); }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
  function resetToInitial(newExam) {
    stopTimer();
    elapsed = 0;
    segStart = Date.now();
    running = false;
    started = false;
    finished = false;
    exam = newExam;
    keepScreen(false);
    $('mask').classList.add('hidden');
    jumping = true;   // 重置瞬间指针直接跳转，避免大角度回旋动画
    render();
    jumping = false;
    secHand.classList.remove('no-trans');
    minHand.classList.remove('no-trans');
    hourHand.classList.remove('no-trans');
  }
  function busy() { return started || running || finished; }

  $('btnMain').addEventListener('click', function () {
    if (finished) return;
    if (running) {
      elapsed += Date.now() - segStart;
      running = false;
      stopTimer();
      keepScreen(false);
    } else {
      if (!started) { elapsed = 0; started = true; }
      segStart = Date.now();
      running = true;
      startTimer();
      ensureAudio();   // 借用户点击解锁音频，保证到时提示音能响
      keepScreen(true);
    }
    render();
  });
  $('btnReset').addEventListener('click', function () {
    if (!busy()) { toast('当前未开始，无需重置'); return; }
    askConfirm('重置计时', '确定要重置当前进度吗？', function () { resetToInitial(exam); });
  });
  var seekEl = $('seek');
  if (window.PointerEvent) {
    seekEl.addEventListener('pointerdown', onSeekDown);
    window.addEventListener('pointermove', onSeekMove);
    window.addEventListener('pointerup', onSeekUp);
    window.addEventListener('pointercancel', onSeekUp);
  } else {
    seekEl.addEventListener('touchstart', onSeekDown, { passive: false });
    window.addEventListener('touchmove', onSeekMove, { passive: false });
    window.addEventListener('touchend', onSeekUp);
    seekEl.addEventListener('mousedown', onSeekDown);
    window.addEventListener('mousemove', onSeekMove);
    window.addEventListener('mouseup', onSeekUp);
  }
  ['xingce', 'shenlun'].forEach(function (key) {
    $('tab-' + key).addEventListener('click', function () {
      if (exam.key === key) { toast('已是当前科目'); return; }
      if (!busy()) {
        resetToInitial(EXAMS[key]);
        return;
      }
      askConfirm('切换考试', '切换后当前计时将被重置，确定吗？', function () { resetToInitial(EXAMS[key]); });
    });
  });
  $('btnMaskClose').addEventListener('click', function () { $('mask').classList.add('hidden'); });
  $('btnMaskRestart').addEventListener('click', function () { resetToInitial(exam); });

  render();

  // —— PWA 离线缓存（Electron 以 file:// 打开时自动跳过）——
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
